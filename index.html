<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Travel Assistant</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        :root {
            --primary-color: #E0F7FA; /* Light Blue */
            --secondary-color: #FFFFFF; /* White */
            --accent-color: #4CAF50; /* Nature Green */
            --text-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: 0;
            background-color: var(--primary-color);
            color: var(--text-color);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: var(--accent-color);
            margin: 0;
        }

        .input-form {
            background-color: var(--secondary-color);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 40px;
        }

        .input-form .form-group {
            margin-bottom: 20px;
        }

        .input-form label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .input-form input, .input-form select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .input-form button {
            width: 100%;
            padding: 15px;
            background-color: var(--accent-color);
            color: var(--secondary-color);
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .input-form button:hover {
            background-color: #45a049;
        }

        .itinerary {
            display: none;
        }

        .itinerary-summary {
            background-color: var(--secondary-color);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .itinerary-summary h2 {
            color: var(--accent-color);
            margin-top: 0;
        }

        .slideshow-container {
            position: relative;
            margin-bottom: 20px;
        }

        .slide {
            display: none;
            background-color: var(--secondary-color);
            padding: 20px;
            border-radius: 10px;
        }

        .slide.active {
            display: block;
        }

        .slide h3 {
            color: var(--accent-color);
            margin-top: 0;
        }

        .activity {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .activity-icon {
            font-size: 24px;
            margin-right: 15px;
        }

        .activity-details {
            flex-grow: 1;
        }

        .activity-details p {
            margin: 0;
        }

        .dots {
            text-align: center;
            margin-top: 10px;
        }

        .dot {
            cursor: pointer;
            height: 15px;
            width: 15px;
            margin: 0 2px;
            background-color: #bbb;
            border-radius: 50%;
            display: inline-block;
            transition: background-color 0.6s ease;
        }

        .active, .dot:hover {
            background-color: #717171;
        }


        #map {
            height: 400px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Smart Travel Assistant</h1>
            <p>Your personal AI-powered travel planner</p>
        </div>

        <div class="input-form">
            <div class="form-group">
                <label for="origin">Lokasi Awal</label>
                <input type="text" id="origin" placeholder="e.g., Jakarta">
            </div>
            <div class="form-group">
                <label for="destination">Kota Tujuan</label>
                <input type="text" id="destination" placeholder="e.g., Bandung">
            </div>
            <div class="form-group">
                <label for="budget">Budget (IDR)</label>
                <input type="number" id="budget" placeholder="e.g., 1000000">
            </div>
            <button id="generate-btn">Buat Rencana Perjalanan</button>
        </div>

        <div class="itinerary">
            <div class="itinerary-summary">
                <h2>Rencana Perjalanan Anda</h2>
                <p><strong>Tujuan:</strong> <span id="summary-destination"></span></p>
                <p><strong>Durasi:</strong> <span id="summary-duration"></span> Hari</p>
                <p><strong>Estimasi Biaya:</strong> Rp <span id="summary-cost"></span></p>
            </div>

            <div class="slideshow-container">
                <!-- Slides will be injected here by JavaScript -->
            </div>
            <div class="dots">
                <!-- Dots will be injected here -->
            </div>

            <div id="map"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        document.getElementById('generate-btn').addEventListener('click', function() {
            const origin = document.getElementById('origin').value;
            const destination = document.getElementById('destination').value;
            const budget = document.getElementById('budget').value;

            if (!origin || !destination || !budget) {
                alert('Harap isi semua kolom.');
                return;
            }

            // Simulate AI processing
            const itineraryData = generateItinerary(origin, destination, budget);

            displayItinerary(itineraryData);
        });

        let currentSlide = 0;

        function generateItinerary(origin, destination, budget) {
            // Dummy data generation logic
            const duration = Math.max(2, Math.floor(budget / 500000));
            const totalCost = budget * 0.9; // Simulate using 90% of budget

            const costBreakdown = {
                transportation: budget * 0.25,
                accommodation: budget * 0.4,
                meals: budget * 0.15,
                activities: budget * 0.1
            };

            const dailyPlan = [];
            for (let i = 1; i <= duration; i++) {
                dailyPlan.push({
                    day: i,
                    theme: `Day ${i} Theme`,
                    activities: [
                        { time: '09:00', activity: `Aktivitas Pagi Hari ${i}`, description: 'Deskripsi singkat aktivitas.', cost: 50000, location: { lat: -6.9022, lng: 107.6186 } },
                        { time: '13:00', activity: `Makan Siang Hari ${i}`, description: 'Mencoba makanan khas lokal.', cost: 75000, location: { lat: -6.9175, lng: 107.6191 } },
                        { time: '15:00', activity: `Aktivitas Sore Hari ${i}`, description: 'Jalan-jalan santai.', cost: 30000, location: { lat: -6.8915, lng: 107.6107 } }
                    ]
                });
            }

            return {
                request: { origin, destination, budget },
                itinerary: {
                    duration_days: duration,
                    total_estimated_cost: totalCost,
                    cost_breakdown: costBreakdown,
                    daily_plan: dailyPlan,
                    destination_coords: { lat: -6.9175, lng: 107.6191 } // Example: Bandung
                }
            };
        }

        function displayItinerary(data) {
            document.querySelector('.itinerary').style.display = 'block';

            document.getElementById('summary-destination').textContent = data.request.destination;
            document.getElementById('summary-duration').textContent = data.itinerary.duration_days;
            document.getElementById('summary-cost').textContent = data.itinerary.total_estimated_cost.toLocaleString('id-ID');

            const slideshowContainer = document.querySelector('.slideshow-container');
            const dotsContainer = document.querySelector('.dots');
            slideshowContainer.innerHTML = '';
            dotsContainer.innerHTML = '';

            data.itinerary.daily_plan.forEach((day, index) => {
                const slide = document.createElement('div');
                slide.className = 'slide';
                if (index === 0) slide.classList.add('active');

                let activitiesHtml = `<h3>Hari ke-${day.day}</h3>`;
                day.activities.forEach(act => {
                    activitiesHtml += `
                        <div class="activity">
                            <div class="activity-icon">${getActivityIcon(act.activity)}</div>
                            <div class="activity-details">
                                <p><strong>${act.time} - ${act.activity}</strong></p>
                                <p>${act.description}</p>
                                <p><em>Estimasi Biaya: Rp ${act.cost.toLocaleString('id-ID')}</em></p>
                            </div>
                        </div>
                    `;
                });
                slide.innerHTML = activitiesHtml;
                slideshowContainer.appendChild(slide);

                const dot = document.createElement('span');
                dot.className = 'dot';
                dot.addEventListener('click', () => showSlide(index));
                dotsContainer.appendChild(dot);
            });

            showSlide(0);

            setupMap(data.itinerary);
        }

        function showSlide(n) {
            let i;
            let slides = document.getElementsByClassName("slide");
            let dots = document.getElementsByClassName("dot");
            if (n >= slides.length) {currentSlide = 0}
            if (n < 0) {currentSlide = slides.length - 1}
            for (i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";
            }
            for (i = 0; i < dots.length; i++) {
                dots[i].className = dots[i].className.replace(" active", "");
            }
            slides[currentSlide].style.display = "block";
            dots[currentSlide].className += " active";
        }


        function getActivityIcon(activityName) {
            if (activityName.toLowerCase().includes('makan') || activityName.toLowerCase().includes('lunch') || activityName.toLowerCase().includes('dinner')) {
                return '🍽️';
            }
            if (activityName.toLowerCase().includes('wisata') || activityName.toLowerCase().includes('aktivitas') || activityName.toLowerCase().includes('jalan')) {
                return '📸';
            }
            return '🏨';
        }

        let map;
        function setupMap(itinerary) {
            if (map) {
                map.remove();
            }
            map = L.map('map').setView([itinerary.destination_coords.lat, itinerary.destination_coords.lng], 13);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);

            itinerary.daily_plan.forEach(day => {
                day.activities.forEach(act => {
                    L.marker([act.location.lat, act.location.lng]).addTo(map)
                        .bindPopup(`<b>${act.activity}</b><br>${act.description}`)
                        .openPopup();
                });
            });
        }
    </script>
</body>
</html>
