<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Travel Assistant</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        :root {
            --primary-color: #E0F7FA; /* Light Blue */
            --secondary-color: #FFFFFF; /* White */
            --accent-color: #4CAF50; /* Nature Green */
            --text-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: 0;
            background-color: var(--primary-color);
            color: var(--text-color);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: var(--accent-color);
            margin: 0;
        }

        .input-form {
            background-color: var(--secondary-color);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 40px;
        }

        .input-form .form-group {
            margin-bottom: 20px;
        }

        .input-form label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .input-form input, .input-form select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .input-form button {
            width: 100%;
            padding: 15px;
            background-color: var(--accent-color);
            color: var(--secondary-color);
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .input-form button:hover {
            background-color: #45a049;
        }

        .itinerary {
            display: none;
        }

        .itinerary-summary {
            background-color: var(--secondary-color);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .itinerary-summary h2 {
            color: var(--accent-color);
            margin-top: 0;
        }

        .slideshow-container {
            position: relative;
            margin-bottom: 20px;
        }

        .slide {
            display: none;
            background-color: var(--secondary-color);
            padding: 20px;
            border-radius: 10px;
        }

        .slide.active {
            display: block;
        }

        .slide h3 {
            color: var(--accent-color);
            margin-top: 0;
        }

        .activity {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .activity-icon {
            font-size: 24px;
            margin-right: 15px;
        }

        .activity-details {
            flex-grow: 1;
        }

        .activity-details p {
            margin: 0;
        }

        .dots {
            text-align: center;
            margin-top: 10px;
        }

        .dot {
            cursor: pointer;
            height: 15px;
            width: 15px;
            margin: 0 2px;
            background-color: #bbb;
            border-radius: 50%;
            display: inline-block;
            transition: background-color 0.6s ease;
        }

        .active, .dot:hover {
            background-color: #717171;
        }

        .prev, .next {
            cursor: pointer;
            position: absolute;
            top: 50%;
            width: auto;
            padding: 16px;
            margin-top: -22px;
            color: white;
            font-weight: bold;
            font-size: 18px;
            transition: 0.6s ease;
            border-radius: 0 3px 3px 0;
            user-select: none;
            background-color: rgba(0,0,0,0.5);
        }

        .next {
            right: 0;
            border-radius: 3px 0 0 3px;
        }

        .prev:hover, .next:hover {
            background-color: rgba(0,0,0,0.8);
        }

        #map {
            height: 400px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Smart Travel Assistant</h1>
            <p>Your personal AI-powered travel planner</p>
        </div>

        <div class="input-form">
            <div class="form-group">
                <label for="origin">Lokasi Awal</label>
                <input type="text" id="origin" placeholder="e.g., Jakarta">
            </div>
            <div class="form-group">
                <label for="destination">Kota Tujuan</label>
                <input type="text" id="destination" placeholder="e.g., Bandung">
            </div>
            <div class="form-group">
                <label for="budget">Budget (IDR)</label>
                <input type="number" id="budget" placeholder="e.g., 1000000">
            </div>
            <button id="generate-btn">Buat Rencana Perjalanan</button>
        </div>

        <div class="itinerary">
            <div class="itinerary-summary">
                <h2>Rencana Perjalanan Anda</h2>
                <p><strong>Tujuan:</strong> <span id="summary-destination"></span></p>
                <p><strong>Durasi:</strong> <span id="summary-duration"></span> Hari</p>
                <p><strong>Estimasi Biaya:</strong> Rp <span id="summary-cost"></span></p>
            <div class="cost-breakdown">
                <h4>Alokasi Budget:</h4>
                <p>Transportasi: Rp <span id="cost-transportation"></span></p>
                <p>Akomodasi: Rp <span id="cost-accommodation"></span></p>
                <p>Makan: Rp <span id="cost-meals"></span></p>
                <p>Aktivitas: Rp <span id="cost-activities"></span></p>
            </div>
            </div>

            <div class="slideshow-container">
                <!-- Slides will be injected here by JavaScript -->
            <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
            <a class="next" onclick="plusSlides(1)">&#10095;</a>
            </div>
            <div class="dots">
                <!-- Dots will be injected here -->
            </div>

            <div id="map"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        document.getElementById('generate-btn').addEventListener('click', function() {
            const origin = document.getElementById('origin').value;
            const destination = document.getElementById('destination').value;
            const budget = document.getElementById('budget').value;

            if (!origin || !destination || !budget) {
                alert('Harap isi semua kolom.');
                return;
            }

            // Simulate AI processing
            const itineraryData = generateItinerary(origin, destination, budget);

            displayItinerary(itineraryData);
        });

        let currentSlide = 0;

        const dummyData = {
            "bandung": {
                coords: { lat: -6.9175, lng: 107.6191 },
                attractions: [
                    { name: "Kawah Putih", cost: 50000, description: "Danau kawah vulkanik yang menakjubkan.", location: { lat: -7.166, lng: 107.402 } },
                    { name: "Farmhouse Lembang", cost: 30000, description: "Tempat wisata dengan konsep peternakan Eropa.", location: { lat: -6.832, lng: 107.609 } },
                    { name: "Tangkuban Perahu", cost: 75000, description: "Gunung berapi aktif dengan pemandangan kawah yang indah.", location: { lat: -6.759, lng: 107.609 } }
                ],
                restaurants: [
                    { name: "Warung Nasi Ibu Imas", cost: 50000, description: "Nasi timbel komplit yang legendaris.", location: { lat: -6.921, lng: 107.604 } },
                    { name: "Seblak Sultan", cost: 30000, description: "Seblak dengan berbagai pilihan topping.", location: { lat: -6.888, lng: 107.615 } },
                    { name: "Lereng Anteng Panoramic Coffee Place", cost: 60000, description: "Ngopi dengan pemandangan kota Bandung.", location: { lat: -6.838, lng: 107.62 } }
                ]
            },
            "yogyakarta": {
                coords: { lat: -7.7956, lng: 110.3695 },
                attractions: [
                    { name: "Candi Borobudur", cost: 350000, description: "Candi Buddha terbesar di dunia.", location: { lat: -7.607, lng: 110.203 } },
                    { name: "Jalan Malioboro", cost: 0, description: "Pusat perbelanjaan dan oleh-oleh khas Yogyakarta.", location: { lat: -7.792, lng: 110.365 } },
                    { name: "Prambanan", cost: 350000, description: "Kompleks candi Hindu yang megah.", location: { lat: -7.752, lng: 110.491 } }
                ],
                restaurants: [
                    { name: "Gudeg Yu Djum", cost: 40000, description: "Gudeg legendaris di Yogyakarta.", location: { lat: -7.782, lng: 110.366 } },
                    { name: "Sate Klathak Pak Pong", cost: 25000, description: "Sate kambing yang ditusuk dengan jeruji sepeda.", location: { lat: -7.89, lng: 110.39 } },
                    { name: "Angkringan Lik Man", cost: 15000, description: "Angkringan pertama di Yogyakarta.", location: { lat: -7.79, lng: 110.36 } }
                ]
            }
        };

        function generateItinerary(origin, destination, budget) {
            const dest = destination.toLowerCase();
            const cityData = dummyData[dest];

            if (!cityData) {
                alert("Maaf, data untuk kota tujuan tersebut belum tersedia.");
                return null;
            }

            const duration = Math.max(2, Math.floor(budget / 750000));
            const totalCost = budget * 0.95;

            const costBreakdown = {
                transportation: budget * 0.3,
                accommodation: budget * 0.4,
                meals: budget * 0.2,
                activities: budget * 0.1
            };

            const dailyPlan = [];
            for (let i = 1; i <= duration; i++) {
                const activities = [];
                activities.push({
                    time: '09:00',
                    activity: cityData.attractions[(i - 1) % cityData.attractions.length].name,
                    description: cityData.attractions[(i - 1) % cityData.attractions.length].description,
                    cost: cityData.attractions[(i - 1) % cityData.attractions.length].cost,
                    location: cityData.attractions[(i - 1) % cityData.attractions.length].location
                });
                activities.push({
                    time: '13:00',
                    activity: `Makan siang di ${cityData.restaurants[(i - 1) % cityData.restaurants.length].name}`,
                    description: cityData.restaurants[(i - 1) % cityData.restaurants.length].description,
                    cost: cityData.restaurants[(i - 1) % cityData.restaurants.length].cost,
                    location: cityData.restaurants[(i - 1) % cityData.restaurants.length].location
                });
                 activities.push({
                    time: '15:00',
                    activity: cityData.attractions[(i) % cityData.attractions.length].name,
                    description: cityData.attractions[(i) % cityData.attractions.length].description,
                    cost: cityData.attractions[(i) % cityData.attractions.length].cost,
                    location: cityData.attractions[(i) % cityData.attractions.length].location
                });

                dailyPlan.push({
                    day: i,
                    theme: `Menjelajahi ${destination}`,
                    activities: activities
                });
            }

            return {
                request: { origin, destination, budget },
                itinerary: {
                    duration_days: duration,
                    total_estimated_cost: totalCost,
                    cost_breakdown: costBreakdown,
                    daily_plan: dailyPlan,
                    destination_coords: cityData.coords
                }
            };
        }

        function displayItinerary(data) {
            document.querySelector('.itinerary').style.display = 'block';

            document.getElementById('summary-destination').textContent = data.request.destination;
            document.getElementById('summary-duration').textContent = data.itinerary.duration_days;
            document.getElementById('summary-cost').textContent = data.itinerary.total_estimated_cost.toLocaleString('id-ID');

            document.getElementById('cost-transportation').textContent = data.itinerary.cost_breakdown.transportation.toLocaleString('id-ID');
            document.getElementById('cost-accommodation').textContent = data.itinerary.cost_breakdown.accommodation.toLocaleString('id-ID');
            document.getElementById('cost-meals').textContent = data.itinerary.cost_breakdown.meals.toLocaleString('id-ID');
            document.getElementById('cost-activities').textContent = data.itinerary.cost_breakdown.activities.toLocaleString('id-ID');

            const slideshowContainer = document.querySelector('.slideshow-container');
            const dotsContainer = document.querySelector('.dots');
            slideshowContainer.innerHTML = `
                <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
                <a class="next" onclick="plusSlides(1)">&#10095;</a>
            `;
            dotsContainer.innerHTML = '';

            data.itinerary.daily_plan.forEach((day, index) => {
                const slide = document.createElement('div');
                slide.className = 'slide';

                let activitiesHtml = `<h3>Hari ke-${day.day}</h3>`;
                day.activities.forEach(act => {
                    activitiesHtml += `
                        <div class="activity">
                            <div class="activity-icon">${getActivityIcon(act.activity)}</div>
                            <div class="activity-details">
                                <p><strong>${act.time} - ${act.activity}</strong></p>
                                <p>${act.description}</p>
                                <p><em>Estimasi Biaya: Rp ${act.cost.toLocaleString('id-ID')}</em></p>
                            </div>
                        </div>
                    `;
                });
                slide.innerHTML = activitiesHtml;
                slideshowContainer.appendChild(slide);

                const dot = document.createElement('span');
                dot.className = 'dot';
                dot.addEventListener('click', () => currentSlide = index, showSlides());
                dotsContainer.appendChild(dot);
            });

            showSlides();

            setupMap(data.itinerary);
        }

        function plusSlides(n) {
            currentSlide += n;
            showSlides();
        }

        function showSlides() {
            let i;
            let slides = document.getElementsByClassName("slide");
            let dots = document.getElementsByClassName("dot");
            if (currentSlide >= slides.length) {currentSlide = 0}
            if (currentSlide < 0) {currentSlide = slides.length - 1}
            for (i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";
            }
            for (i = 0; i < dots.length; i++) {
                dots[i].className = dots[i].className.replace(" active", "");
            }
            slides[currentSlide].style.display = "block";
            dots[currentSlide].className += " active";
        }

        function getActivityIcon(activityName) {
            if (activityName.toLowerCase().includes('makan') || activityName.toLowerCase().includes('lunch') || activityName.toLowerCase().includes('dinner')) {
                return '🍽️';
            }
            if (activityName.toLowerCase().includes('wisata') || activityName.toLowerCase().includes('aktivitas') || activityName.toLowerCase().includes('jalan')) {
                return '📸';
            }
            return '🏨';
        }

        let map;
        function setupMap(itinerary) {
            if (map) {
                map.remove();
            }
            map = L.map('map').setView([itinerary.destination_coords.lat, itinerary.destination_coords.lng], 13);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);

            itinerary.daily_plan.forEach(day => {
                day.activities.forEach(act => {
                    L.marker([act.location.lat, act.location.lng]).addTo(map)
                        .bindPopup(`<b>${act.activity}</b><br>${act.description}`)
                        .openPopup();
                });
            });
        }
    </script>
</body>
</html>
